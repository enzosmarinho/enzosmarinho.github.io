<style>
  :root {
    --bg:#060011; --surface:#11042A; --text:#EDE9FE; --muted:#9D8FC9;
    --primary:#8B5CF6; --accent:#D8B4FE; --line:rgba(168,85,247,.16);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,sans-serif; font-weight:400;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:clamp(24px,6vw,72px); line-height:1.6;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,92,246,.13), transparent 70%);
  }
  main { width:100%; max-width:620px; }
  .wm { width:min(100%,430px); height:auto; display:block; margin-bottom:clamp(28px,5vw,40px); }
  .eyebrow {
    font-family:'DM Mono',ui-monospace,monospace; font-size:.72rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); margin-bottom:14px;
  }
  .lede {
    font-family:'Instrument Serif',Georgia,serif; font-size:clamp(1.5rem,4.2vw,2rem);
    line-height:1.28; margin-bottom:22px; font-weight:400;
  }
  .lede em { font-style:italic; color:var(--accent); }
  p.nota { color:var(--muted); font-size:1rem; max-width:52ch; }
  hr { border:0; border-top:1px solid var(--line); margin:clamp(28px,5vw,38px) 0; }
  .contato { display:flex; flex-wrap:wrap; gap:10px 26px; }
  .contato a {
    color:var(--text); text-decoration:none; font-size:.95rem;
    border-bottom:1px solid var(--line); padding-bottom:2px;
    transition:color .18s ease, border-color .18s ease;
  }
  .contato a:hover, .contato a:focus-visible { color:var(--accent); border-color:var(--accent); }
  .contato a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:2px; }
  footer {
    margin-top:clamp(30px,5vw,44px); font-family:'DM Mono',ui-monospace,monospace;
    font-size:.72rem; letter-spacing:.05em; color:var(--muted); opacity:.75;
  }
  @media (prefers-reduced-motion:no-preference) {
    main > * { animation:sobe .6s cubic-bezier(.22,.9,.3,1) backwards; }
    main > *:nth-child(2) { animation-delay:.06s }
    main > *:nth-child(3) { animation-delay:.12s }
    main > *:nth-child(4) { animation-delay:.18s }
    main > *:nth-child(6) { animation-delay:.24s }
    @keyframes sobe { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
  }
</style>
